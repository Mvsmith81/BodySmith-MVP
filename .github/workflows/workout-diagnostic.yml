name: Workout Production Diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/prod-workout-diagnostic.mjs'
      - '.github/workflows/workout-diagnostic.yml'
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/prod-workout-diagnostic.mjs
