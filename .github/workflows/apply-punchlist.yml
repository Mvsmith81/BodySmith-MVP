name: Apply BodySmith punchlist patch
on:
  push:
    paths:
      - 'tools/apply-punchlist.py'
      - 'tools/retrigger-punchlist.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply targeted production patch
        run: python tools/apply-punchlist.py
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Run full test suite
        run: npm test
      - name: Commit production changes and remove one-time patch tooling
        run: |
          rm -f tools/apply-punchlist.py tools/retrigger-punchlist.txt .github/workflows/apply-punchlist.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Improve exercise swapping, RPE guidance and plan naming"
          git push
