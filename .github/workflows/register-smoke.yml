name: Live Account and Workout Smoke Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run test:backend
      - run: node tests/session-smoke.mjs
      - run: npm run test:live-ui
