name: Finish Forge MVP polish
on:
  push:
    paths:
      - 'tools/forge-polish.py'
      - 'tools/forge-polish-retry.txt'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply Forge MVP completion patch
        run: python tools/forge-polish.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run local regression suite
        run: npm test
      - name: Run live Forge backend smoke test
        run: npm run test:forge
      - name: Commit Forge polish
        run: |
          rm -f tools/forge-polish.py tools/forge-polish-retry.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/forge-polish.yml || true
          git commit -m "Complete Forge editing and progress-sharing MVP"
          git push
