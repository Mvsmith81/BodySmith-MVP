name: Prepare BodySmith v2.8 auth and flexible-workout release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-280-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Patch v2.8 frontend and backend
        run: |
          node scripts/patch-v28.cjs
          sed -i 's/v2\.7\.0/v2.8.0/g' history-log.js
          find tests -type f -name '*.cjs' -exec sed -i 's/20260915-release270/20260915-release280/g' {} +
          sed -i 's/v2\.7\.0/v2.8.0/g' tests/history-ui-smoke.cjs
      - name: Run validation
        run: npm test
      - name: Commit release patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js history-log.js package.json package-lock.json tests supabase/functions/bodysmith-api/index.ts
          git commit -m 'Release BodySmith v2.8.0 account and workout flexibility' || exit 0
          git push
      - name: Confirm release patch
        run: echo 'v2.8 release patch completed'
