name: Validate BodySmith
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Validate PWA and media
        run: node tests/assets-smoke.cjs
      - name: Check live backend health
        run: node -e "fetch('https://uuzctytbguqjumwpczfh.supabase.co/functions/v1/bodysmith-api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'health'})}).then(async r=>{if(!r.ok||!(await r.json()).ok)process.exit(1);console.log('Backend healthy')})"
