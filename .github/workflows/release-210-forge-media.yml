name: BodySmith v2.10 Forge media release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-210-forge-media.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Wire v2.10 Forge media release
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['app.js','history-log.js']){
            let s=fs.readFileSync(file,'utf8');
            s=s.replaceAll('v2.9.0','v2.10.0');
            fs.writeFileSync(file,s);
          }

          let html=fs.readFileSync('index.html','utf8').replaceAll('20260915-release291','20260915-release210');
          if(!html.includes('release-210.css')) html=html.replace('<link rel="stylesheet" href="./release-29.css?v=20260915-release210" />','<link rel="stylesheet" href="./release-29.css?v=20260915-release210" />\n  <link rel="stylesheet" href="./release-210.css?v=20260915-release210" />');
          if(!html.includes('forge-media-upgrade.js')) html=html.replace('<script src="./nutrition.js?v=20260915-release210"></script>','<script src="./nutrition.js?v=20260915-release210"></script>\n  <script src="./forge-media-upgrade.js?v=20260915-release210"></script>');
          fs.writeFileSync('index.html',html);

          let sw=fs.readFileSync('sw.js','utf8').replaceAll('20260915-release291','20260915-release210').replaceAll('bodysmith-release-2.9.0-release291','bodysmith-release-2.10.0-release210');
          if(!sw.includes('./release-210.css?v=20260915-release210')) sw=sw.replace('"./release-29.css?v=20260915-release210",','"./release-29.css?v=20260915-release210", "./release-210.css?v=20260915-release210",');
          if(!sw.includes('./forge-media-upgrade.js?v=20260915-release210')) sw=sw.replace('"./nutrition.js?v=20260915-release210",','"./nutrition.js?v=20260915-release210", "./forge-media-upgrade.js?v=20260915-release210",');
          fs.writeFileSync('sw.js',sw);

          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version='2.10.0';
          if(!pkg.scripts.test.includes('forge-media-upgrade.js')) pkg.scripts.test=pkg.scripts.test.replace('node --check sw.js','node --check forge-media-upgrade.js && node --check sw.js')+' && node tests/forge-media-upgrade-smoke.cjs';
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));lock.version='2.10.0';if(lock.packages?.[''])lock.packages[''].version='2.10.0';fs.writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n');

          for(const file of fs.readdirSync('tests').filter(f=>f.endsWith('.cjs'))){
            const path='tests/'+file;let s=fs.readFileSync(path,'utf8');
            s=s.replaceAll('20260915-release291','20260915-release210');
            s=s.replaceAll('bodysmith-release-2.9.0-release291','bodysmith-release-2.10.0-release210');
            s=s.replaceAll('bodysmith-release-2.9.0-release210','bodysmith-release-2.10.0-release210');
            if(file==='history-ui-smoke.cjs')s=s.replaceAll('v2.9.0','v2.10.0');
            if(file==='brand-smoke.cjs')s=s.replace('|9\\.0)', '|9\\.0|10\\.0)');
            fs.writeFileSync(path,s);
          }
          NODE
      - name: Run validation
        run: npm test
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/release-210-forge-media.yml
          git add app.js history-log.js index.html sw.js package.json package-lock.json tests/*.cjs
          git commit -m 'Release BodySmith v2.10 Forge media and YouTube embeds'
          git push
