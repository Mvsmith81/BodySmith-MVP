name: BodySmith v2.9.1 cache hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-291-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Normalize visible release and bust all shell assets
        run: |
          node <<'NODE'
          const fs=require('fs');
          let app=fs.readFileSync('app.js','utf8');
          app=app.replaceAll('v2.8.0','v2.9.0');
          fs.writeFileSync('app.js',app);

          for(const file of ['index.html','sw.js','tests/auth-flex-v28-smoke.cjs','tests/release29-smoke.cjs']){
            let s=fs.readFileSync(file,'utf8');
            s=s.replaceAll('20260915-release280','20260915-release291');
            s=s.replaceAll('20260915-release281','20260915-release291');
            s=s.replaceAll('20260915-release290','20260915-release291');
            s=s.replaceAll('bodysmith-release-2.9.0-release290','bodysmith-release-2.9.0-release291');
            fs.writeFileSync(file,s);
          }

          let brand=fs.readFileSync('tests/brand-smoke.cjs','utf8');
          brand=brand.replace('(?:4\\.2|5(?:\\.1)?|7\\.0|8\\.0)', '(?:4\\.2|5(?:\\.1)?|7\\.0|8\\.0|9\\.0)');
          fs.writeFileSync('tests/brand-smoke.cjs',brand);
          NODE
      - name: Run validation
        run: npm test
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js index.html sw.js tests/auth-flex-v28-smoke.cjs tests/release29-smoke.cjs tests/brand-smoke.cjs
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Hotfix BodySmith v2.9 core version cache'
            git push
          fi
