name: Patch BodySmith v2.7.0 release metadata

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-270-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize displayed version and cache release
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = ['app.js','history-log.js','index.html','sw.js','package.json','tests/history-ui-smoke.cjs','tests/flexible-profile-smoke.cjs'];
          for (const file of files) {
            if (!fs.existsSync(file)) continue;
            let s = fs.readFileSync(file,'utf8');
            s = s.replaceAll('v2.5.1','v2.7.0');
            s = s.replaceAll('v2.6.1','v2.7.0');
            s = s.replaceAll('"version": "2.6.1"','"version": "2.7.0"');
            s = s.replaceAll('20260915-flex263','20260915-release270');
            s = s.replaceAll('bodysmith-release-2.6.1-flex263','bodysmith-release-2.7.0-release270');
            fs.writeFileSync(file,s);
          }
          NODE
      - name: Run validation
        run: npm test
      - name: Commit normalized release metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js history-log.js index.html sw.js package.json tests/history-ui-smoke.cjs tests/flexible-profile-smoke.cjs
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Release BodySmith v2.7.0'
            git push
          fi