name: Finish BodySmith brand sprint
on:
  push:
    paths:
      - 'tools/finish-brand-sprint.py'
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply final brand QA polish
        run: python tools/finish-brand-sprint.py
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run regression suite
        run: npm test
      - name: Commit final polish and remove one-time tooling
        run: |
          rm -f tools/finish-brand-sprint.py .github/workflows/finish-brand-sprint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish BodySmith 2.4 brand polish and mobile navigation QA"
          git push
